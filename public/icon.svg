<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#ffffff"/>
    <!-- Rangée haute : KO + clé verte -->
    <text x="96" y="238" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#163a6a" letter-spacing="-4">KO</text>
    <!-- Clé verte : anneau + tige + dents -->
    <g stroke="#2e9b3f" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="398" cy="176" r="46" stroke-width="24"/>
      <line x1="300" y1="176" x2="352" y2="176" stroke-width="24"/>
      <path d="M300 176 v34 M330 176 v26" stroke-width="20"/>
    </g>
    <!-- Rangée basse : SOFT -->
    <text x="256" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#163a6a" letter-spacing="-2">SOFT</text>
  </g>
</svg>
